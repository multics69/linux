---
name: dev-energy-model

doc: |
  Energy model netlink interface to notify its changes.

protocol: genetlink

uapi-header: linux/dev_energy_model.h

attribute-sets:
  -
    name: perf-domains
    attributes:
      -
        name: perf-domain
        type: nest
        nested-attributes: perf-domain
        multi-attr: true
  -
    name: perf-domain
    attributes:
      -
        name: pad
        type: pad
      -
        name: perf-domain-id
        type: u32
      -
        name: flags
        type: u64
      -
        name: cpus
        type: string
  -
    name: perf-table
    attributes:
      -
        name: perf-domain-id
        type: u32
      -
        name: perf-state
        type: nest
        nested-attributes: perf-state
        multi-attr: true
  -
    name: perf-state
    attributes:
      -
        name: pad
        type: pad
      -
        name: performance
        type: u64
      -
        name: frequency
        type: u64
      -
        name: power
        type: u64
      -
        name: cost
        type: u64
      -
        name: flags
        type: u64

operations:
  list:
    -
      name: get-perf-domains
      attribute-set: perf-domains
      doc: Get the list of information for all performance domains.
      do:
        reply:
          attributes:
            - perf-domain
    -
      name: get-perf-table
      attribute-set: perf-table
      doc: Get the energy model table of a performance domain.
      do:
        request:
          attributes:
            - perf-domain-id
        reply:
          attributes:
            - perf-domain-id
            - perf-state
    -
      name: perf-domain-created
      doc: A performance domain is created.
      notify: get-perf-table
      mcgrp: event
    -
      name: perf-domain-updated
      doc: A performance domain is updated.
      notify: get-perf-table
      mcgrp: event
    -
      name: perf-domain-deleted
      doc: A performance domain is deleted.
      attribute-set: perf-table
      event:
        attributes:
          - perf-domain-id
      mcgrp: event

mcast-groups:
  list:
    -
      name: event
